services:
  - type: web
    name: baomyshop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: baomyshop-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true

databases:
  - name: baomyshop-db
    plan: basic-256mb
    databaseName: baomyshop
    user: baomyshop
